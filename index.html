        z-index: 1;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 13px;
        font-weight: 500;
      }
      .hero-photo figcaption svg {
        width: 15px;
        height: 15px;
      }
      .hero-photo.reveal img {
        animation: photo-in 1.4s var(--ease) both;
      }
      @keyframes photo-in {
        from {
          opacity: 0;
          transform: scale(1.06);
        }
      }
      .type-card .type-symbol.has-photo {
        overflow: hidden;
        padding: 0;
      }
      .type-symbol.has-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .type-card:not(.selected) .type-symbol.has-photo img {
        filter: saturate(0.85);
      }

      /* ---------- Responsive ---------- */
      .stack,
      .panel,
      .detail-grid > *,
      .quote-grid > *,
      .chart-grid > * {
        min-width: 0;
      }
      @media (max-width: 1280px) {
        .sidebar {
          width: 232px;
        }
        .shell {
          margin-left: 232px;
        }
        .topbar,
        .content {
          padding-left: 32px;
          padding-right: 32px;
        }
        .topbar-location {
          display: none;
        }
        .topbar {
          grid-template-columns: auto 1fr auto;
        }
        .view-toggle {
          justify-self: center;
        }
        .metric {
          padding: 22px;
        }
        .metric-value {
          font-size: 38px;
        }
        .detail-grid,
        .quote-grid {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
        .page-actions .optional-action {
          display: none;
        }
        .client-mode .topbar {
          padding: 0 32px;
        }
      }
      @media (max-width: 1080px) {
        .sidebar {
          width: 76px;
          padding: 22px 12px;
          align-items: center;
        }
        .sidebar .brand-name,
        .workspace-label,
        .side-bottom {
          display: none;
        }
        .sidebar > a {
          padding: 6px 0 0;
        }
        .side-nav {
          margin-top: 34px;
        }
        .nav-button {
          width: 48px;
          justify-content: center;
          padding: 0;
          font-size: 0;
          gap: 0;
        }
        .nav-count {
          display: none;
        }
        .shell {
          margin-left: 76px;
        }
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .metric:nth-child(3)::before {
          display: none;
        }
        .metric:nth-child(n + 3) {
          border-top: 1px solid var(--line);
        }
        .detail-grid,
        .quote-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .quote-summary {
          position: static;
        }
        .client-intro {
          grid-template-columns: minmax(0, 1fr);
          gap: 24px;
        }
        .hero-art,
        .hero-photo {
          display: none;
        }
        .client-hero {
          padding-bottom: 130px;
        }
        .wizard-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .client-aside-wrap {
          position: static;
        }
        .chart-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .search-box input,
        .search-box input:focus {
          width: 220px;
        }
      }
      @media (max-width: 760px) {
        body {
          font-size: 14px;
        }
        h1 {
          font-size: 32px;
        }
        .sidebar {
          width: 280px;
          align-items: stretch;
          padding: 22px 14px 18px;
          transform: translateX(-100%);
          transition: transform 0.4s var(--ease);
          box-shadow: var(--shadow-lg);
          background: rgba(250, 251, 252, 0.96);
        }
        .sidebar .brand-name,
        .workspace-label {
          display: flex;
        }
        .workspace-label {
          display: block;
          margin-top: 30px;
        }
        .side-bottom {
          display: grid;
        }
        .side-nav {
          margin-top: 0;
        }
        .nav-button {
          width: 100%;
          justify-content: flex-start;
          padding: 0 12px;
          font-size: 15px;
          gap: 12px;
          height: 44px;
        }
        .nav-count {
          display: inline-grid;
        }
        .nav-open .sidebar {
          transform: none;
        }
        .nav-open .assumptions {
          display: none;
        }
        .nav-open .nav-scrim {
          display: block;
          position: fixed;
          inset: 0;
          z-index: 35;
          background: rgba(8, 20, 28, 0.4);
          backdrop-filter: blur(4px);
          -webkit-backdrop-filter: blur(4px);
        }
        .shell {
          margin-left: 0;
        }
        .topbar {
          display: flex;
          flex-wrap: wrap;
          justify-content: space-between;
          height: auto;
          padding: 10px 16px;
          gap: 10px;
        }
        .topbar-left {
          gap: 8px;
        }
        .mobile-menu {
          display: inline-grid;
          place-items: center;
          width: 40px;
          height: 40px;
          margin-left: -8px;
          border-radius: 999px;
        }
        .mobile-menu svg {
          width: 20px;
          height: 20px;
        }
        .mobile-brand {
          display: flex;
        }
        .mobile-brand .brand-mark {
          width: 22px;
          height: 26px;
        }
        .mobile-brand .brand-name {
          font-size: 13px;
        }
        .mobile-brand .brand-sub {
          font-size: 6.5px;
        }
        .topbar-right .sample-badge {
          display: none;
        }
        .topbar-right .avatar.owner {
          width: 32px;
          height: 32px;
        }
        .view-toggle {
          order: 3;
          width: 100%;
        }
        .view-toggle button {
          flex: 1;
          justify-content: center;
          min-height: 38px;
          padding: 0 10px;
        }
        .client-mode .topbar {
          padding: 10px 16px;
        }
        .content {
          padding: 28px 16px 56px;
        }
        .page-heading {
          flex-direction: column;
          align-items: stretch;
          gap: 18px;
          margin-bottom: 26px;
        }
        .page-heading p {
          font-size: 15px;
        }
        .page-actions {
          flex-wrap: wrap;
        }
        .page-actions .btn {
          flex: 1;
        }
        .metrics {
          margin-bottom: 26px;
        }
        .metric {
          padding: 18px;
        }
        .metric-value {
          font-size: 32px;
        }
        .metric-bottom {
          font-size: 12px;
        }
        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        .filter-tabs {
          flex-wrap: nowrap;
          overflow-x: auto;
          margin: 0 -16px;
          padding: 0 16px;
          scrollbar-width: none;
        }
        .filter-tabs button {
          flex-shrink: 0;
          min-height: 40px;
        }
        .search-box input,
        .search-box input:focus {
          width: 100%;
          height: 44px;
          font-size: 16px;
        }
        .board-meta .updated {
          display: none !important;
        }
        .board {
          grid-template-columns: repeat(5, 82vw);
          margin: 0 -16px;
          padding: 0 16px 10px;
          scroll-snap-type: x mandatory;
          scroll-padding: 16px;
        }
        .column {
          scroll-snap-align: start;
        }
        .footer {
          flex-direction: column;
          gap: 10px;
          padding: 22px 16px 90px;
        }
        .client-mode .footer {
          width: calc(100% - 32px);
        }
        .assumptions {
          right: 16px;
          bottom: 16px;
          left: 16px;
        }
        .assumptions-panel {
          width: 100%;

      }
      function resetWizard() {
        wizard = {
          step: 1,
          type: "arch",
          answers: {},
          uploads: [],
          sketch: "",
          contact: { name: "", email: "", phone: "", company: "", windows: [] },
          submitted: null,
        };
      }
      async function handleFiles(files) {
        let added = 0;
        const rejected = [];
        for (const f of Array.from(files)) {
          if (wizard.uploads.length >= 8) {
            rejected.push("Maximum 8 attachments.");
            break;
          }
          if (!f.type.startsWith("image/") && f.type !== "application/pdf") {
            rejected.push("Choose an image or PDF.");
            continue;
          }
          if (f.size > 8 * 1024 * 1024) {
            rejected.push("Each file must be 8 MB or less.");
            continue;
          }
          try {
            const data = await new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onload = () => resolve(r.result);
              r.onerror = reject;
              r.readAsDataURL(f);
            });
            wizard.uploads.push({
              id: "f" + Date.now() + Math.random(),
              name: f.name,
              kind: f.type === "application/pdf" ? "pdf" : "image",
              data,
              sample: false,
            });
            added++;
          } catch {
            rejected.push("A file could not be read. Please try again.");
          }
        }
        render();
        if (rejected.length) toast([...new Set(rejected)].join(" "));
        else if (added)
          toast(`${added} file${added === 1 ? "" : "s"} added to the enquiry`);
      }
      function viewFile(index, source) {
        const f = (
          source === "wizard" ? wizard.uploads : current()?.uploads || []
        )[index];
        if (!f) return;
        document.getElementById("overlay-root").innerHTML =
          `<div class="lightbox" data-action="close-lightbox" role="dialog" aria-modal="true" aria-label="Attachment preview"><div class="lightbox-inner" data-stop="true"><div class="thumb">${fileVisual(f)}</div><div class="lightbox-caption"><span>${esc(f.name)}${f.sample ? ' <span class="tag neutral">Sample drawing</span>' : ""}</span><div class="row">${f.data ? `<a class="btn small" href="${esc(f.data)}" download="${esc(f.name)}">${icon("download")}Download</a>` : ""}<button class="icon-btn" data-action="close-lightbox" aria-label="Close attachment preview">${icon("close")}</button></div></div></div></div>`;
        document
          .querySelector('.lightbox [data-action="close-lightbox"]')
          .focus();
      }
      // Delegated events keep every screen connected without a framework.
      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-action]");
        if (!el) return;
        if (
          el.classList.contains("lightbox") &&
          e.target.closest("[data-stop]")
        )
          return;
        const a = el.dataset.action;
        const j = current();
        e.preventDefault();
        switch (a) {
          case "view":
            ui.view = el.dataset.view;
            render();
            break;
          case "navigate":
            ui.view = "office";
            ui.page = el.dataset.page;
            ui.followOnly = false;
            render();
            window.scrollTo(0, 0);
            break;
          case "open-nav":
            document.body.classList.add("nav-open");
            break;
          case "close-nav":
            document.body.classList.remove("nav-open");
            break;
          case "assumptions":
            ui.assumptions = !ui.assumptions;
            render();
            break;
          case "new-enquiry":
            newEnquiry();
            break;
          case "filter":
            ui.filter = el.dataset.filter;
            render();
            break;
          case "follow-filter":
            ui.view = "office";
            ui.page = "board";
            ui.followOnly = !ui.followOnly;
            ui.filter = "all";
            ui.search = "";
            render();
            break;
          case "clear-follow":
            ui.followOnly = false;
            render();
            break;
          case "open-job":
            openJob(el.dataset.id);
            break;
          case "visit-job":
            openJob(el.dataset.id, "visit");
            break;
          case "quote-job":
            openJob(el.dataset.id, "quote");
            break;
          case "tab":
            ui.tab = el.dataset.tab;
            render();
            break;
          case "job-type":
            if (wizard.type !== el.dataset.type) {
              wizard.type = el.dataset.type;
              wizard.answers = {};
            }
            render();
            break;
          case "wizard-back":
            wizard.step = Math.max(1, wizard.step - 1);
            render();
            window.scrollTo(0, 0);
            break;
          case "visit-window": {
            const w = el.dataset.window;
            wizard.contact.windows = wizard.contact.windows.includes(w)
              ? wizard.contact.windows.filter((x) => x !== w)
              : w === "Flexible"
                ? ["Flexible"]
                : [
                    ...wizard.contact.windows.filter((x) => x !== "Flexible"),
                    w,
                  ];
            render();
            break;
          }
          case "sample-files":
            if (wizard.uploads.length >= 8) {
              toast("Maximum 8 attachments.");
              break;
            }
            wizard.uploads.push(
              sampleUpload(
                wizard.type === "marine"
                  ? "mast-and-deck-detail.svg"
                  : wizard.type === "fab"
                    ? "railing-repair-detail.svg"
                    : "balustrade-site-sketch.svg",
              ),
            );
            if (wizard.uploads.length < 8)
              wizard.uploads.push(sampleUpload("dimensions-markup.pdf", "pdf"));
            render();
            toast("Sample drawings added");
            break;
          case "remove-file":
            wizard.uploads.splice(+el.dataset.index, 1);
            render();
            break;
          case "view-file":
            viewFile(+el.dataset.index, el.dataset.source);
            break;
          case "close-lightbox":
            document.getElementById("overlay-root").innerHTML = "";
            break;
          case "view-submitted":
            openJob(wizard.submitted);
            break;
          case "another-enquiry":
            resetWizard();
            ui.view = "client";
            render();
            window.scrollTo(0, 0);
            break;
          case "log-contact":
            if (j) {
              j.days = 0;
              addActivity(j, "Client contact logged");
              render();
              toast("Contact logged. Follow-up timer reset.");
            }
            break;
          case "add-measure":
            j.measurements.push({
              run: String.fromCharCode(65 + j.measurements.length),
              length: "",
              height: "",
              spacing: "",
              fixings: "",
            });
            persist();
            render();
            break;
          case "remove-measure":
            j.measurements.splice(+el.dataset.index, 1);
            persist();
            render();
            break;
          case "finish-specs":
            j.status = "specs";
            addActivity(j, "Measurements and specifications saved");
            ui.tab = "quote";
            render();
            window.scrollTo(0, 0);
            toast("Specifications saved. Ready to cost the job.");
            break;
          case "add-line": {
            const b = el.dataset.block;
            j.quote[b].push({
              id: "l" + Date.now(),
              desc: "",
              qty: 1,
              unit: b === "labour" ? "person" : "each",
              rate: 0,
              hours: 1,
            });
            persist();
            render();
            break;
          }
          case "remove-line":
            j.quote[el.dataset.block].splice(+el.dataset.index, 1);
            persist();
            render();
            break;
          case "save-quote":
            j.quoteDraft = true;
            addActivity(j, "Quote draft saved");
            toast("Quote draft saved in this browser");
            break;
          case "preview":
            if (!validateQuote()) break;
            j.quoteDraft = true;
            j.quote.issued = j.quote.issued || DEMO_TODAY;
            persist();
            ui.page = "preview";
            render();
            window.scrollTo(0, 0);
            break;
          case "back-quote":
            ui.page = "detail";
            ui.tab = "quote";
            render();
            window.scrollTo(0, 0);
            break;
          case "print":
            window.print();
            break;
          case "mark-sent":
            j.status = "quoted";
            j.days = 0;
            j.quoted = DEMO_TODAY;
            j.quoteTurnaround = Math.max(
              0,
              Math.round(
                (new Date(DEMO_TODAY) - new Date(j.created)) / 86400000,
              ),
            );
            addActivity(j, "Quote marked as sent (demo only)");
            toast("Marked as sent on the board. No email was sent.");
            render();
            break;
        }
      });
      function validateQuote() {
        const fields = document.querySelectorAll(
          ".quote-grid input[type=number]",
        );
        for (const f of fields)
          if (!f.checkValidity()) {
            f.reportValidity();
            return false;
          }
        const q = current().quote;
        const lines = [...q.materials, ...q.labour, ...q.extras];
        if (!lines.length || lines.some((r) => !r.desc.trim())) {
          toast("Add a description for every line item before previewing.");
          return false;
        }
        return true;
      }
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        if (e.target.id === "wizard-form") {
          if (!validateWizard()) return;
          if (wizard.step === 4) {
            submitEnquiry();
            return;
          }
          wizard.step++;
          render();
          window.scrollTo(0, 0);
        }
        if (e.target.id === "visit-form") {
          const j = current(),
            f = new FormData(e.target);
          j.visitDate = f.get("visitDate");
          j.visitTime = f.get("visitTime");
          j.visitAddress = f.get("visitAddress");
          if (j.status === "new") j.status = "visit";
          addActivity(j, "Site visit booked");
          render();
          toast("Site visit saved. The board has been updated.");
        }
      });
      function updateField(e) {
        const t = e.target,
          j = current();
        t.classList.remove("field-error");
        if (t.id === "job-search") {
          ui.search = t.value;
          const b = document.getElementById("kanban");
          if (b) b.innerHTML = boardColumns();
          const count = document.getElementById("job-count");
          if (count) count.textContent = filteredJobs().length + " jobs";
          return;
        }
        if (t.dataset.answer) {
          wizard.answers[t.dataset.answer] = t.value;
          return;
        }
        if (t.dataset.contact) {
          wizard.contact[t.dataset.contact] = t.value;
          return;
        }
        if (t.dataset.wizard === "sketch") {
          wizard.sketch = t.value;
          return;
        }
        if (!j) return;
        if (t.dataset.qfield) {
          const r = j.quote[t.dataset.block][+t.dataset.row];
          const k = t.dataset.qfield;
          r[k] = ["qty", "rate", "hours"].includes(k)
            ? Math.max(0, +t.value || 0)
            : t.value;
          persist();
          updateQuoteNumbers();
          return;
        }
        if (t.id === "quote-margin") {
          j.quote.margin = Math.min(95, Math.max(0, +t.value || 0));
          persist();
          updateQuoteNumbers();
          return;
        }
        if (t.id === "quote-scope") {
          j.quote.scope = t.value;
          persist();
          return;
        }
        if (t.id === "quote-terms") {
          j.quote.terms = t.value;
          persist();
          return;
        }
        if (t.dataset.measure !== undefined) {
          j.measurements[+t.dataset.measure][t.dataset.mfield] = t.value;
          persist();
          return;
        }
        if (t.id === "site-notes") {
          j.notes = t.value;
          persist();
          return;
        }
      }
      document.addEventListener("input", updateField);
      document.addEventListener("change", (e) => {
        updateField(e);
        const t = e.target,
          j = current();
        if (t.id === "file-upload") handleFiles(t.files);
        if (t.id === "job-status" && j) {
          j.status = t.value;
          if (j.status === "quoted") {
            j.quoted = j.quoted || DEMO_TODAY;
          }
          addActivity(
            j,
            "Status updated to " + t.options[t.selectedIndex].text,
          );
          render();
          toast("Job status updated");
        }
        if (t.id === "assigned-role" && j) {
          j.assigned = t.value;
          persist();
          toast("Assignment saved");
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          document.getElementById("overlay-root").innerHTML = "";
          document.body.classList.remove("nav-open");
          if (ui.assumptions) {
            ui.assumptions = false;
            render();
          }
        }
        if (
          (e.key === "Enter" || e.key === " ") &&
          e.target.matches("[role=button][data-action]")
        ) {
          e.preventDefault();
          e.target.click();
        }
        if (
          (e.key === "Enter" || e.key === " ") &&
          e.target.id === "upload-zone"
        ) {
          e.preventDefault();
          document.getElementById("file-upload").click();
        }
      });
      document.addEventListener("dragstart", (e) => {
        const card = e.target.closest(".job-card");
        if (card) {
          dragJob = card.dataset.job;
          e.dataTransfer.setData("text/plain", dragJob);
          e.dataTransfer.effectAllowed = "move";
          card.classList.add("dragging");
        }
      });
      document.addEventListener("dragend", () => {
        dragJob = null;
        document
          .querySelectorAll(".dragging,.dragover")
          .forEach((e) => e.classList.remove("dragging", "dragover"));
      });
      document.addEventListener("dragover", (e) => {
        const target = e.target.closest(".column,#upload-zone");
        if (target) {
          e.preventDefault();
          target.classList.add("dragover");
          if (e.dataTransfer)
            e.dataTransfer.dropEffect = dragJob ? "move" : "copy";
        }
      });
      document.addEventListener("dragleave", (e) => {
        const target = e.target.closest(".column,#upload-zone");
        if (target && !target.contains(e.relatedTarget))
          target.classList.remove("dragover");
      });
      document.addEventListener("drop", (e) => {
        const zone = e.target.closest("#upload-zone");
        if (zone) {
          e.preventDefault();
          zone.classList.remove("dragover");
          handleFiles(e.dataTransfer.files);
          return;
        }
        const col = e.target.closest(".column");
        if (col && dragJob) {
          e.preventDefault();
          const j = jobs.find((j) => j.id === dragJob);
          if (j) {
            j.status =
              col.dataset.stage === "closed" ? "won" : col.dataset.stage;
            if (j.status === "quoted") j.quoted = j.quoted || DEMO_TODAY;
            addActivity(j, "Moved to " + stageOf(j).label);
            render();
            toast(`Moved to ${stageOf(j).label}`);
          }
          dragJob = null;
        }
      });
      for (const [type, src] of Object.entries(PHOTOS)) {
        const img = new Image();
        img.onload = () => {
          photoReady[type] = true;
          if (ui.view === "client") render();
        };
        img.src = src;
      }
      render();
    </script>
  </body>
</html>
